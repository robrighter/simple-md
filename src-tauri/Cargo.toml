[package]
name = "simple_md"
version = "1.0.0"
description = "A local-first markdown editor with charts, math, and desktop file workflows."
edition = "2021"

[lib]
name = "simple_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.100"
futures-util = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = ["charset", "http2", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.9.2", features = [] }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-opener = "2.5.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = "2.3.4"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync"] }
url = "2.5.7"
